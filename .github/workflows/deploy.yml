name: build & deploy site

# Any push to main rebuilds the blog from content/*.md and publishes the site.
# Write a post -> commit the .md -> push. That's the whole loop.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Let the Pages deployment use the GITHUB_TOKEN, and allow OIDC for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build blog from content/*.md
        run: npm run build

      # The static site is served from the repo root; drop node_modules so it
      # isn't dragged into the deploy artifact.
      - name: Trim build-only files
        run: rm -rf node_modules

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
